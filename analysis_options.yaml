include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - avoid_unused_constructor_parameters
    - prefer_collection_literals
    - always_declare_return_types
    - camel_case_types
    - library_prefixes
    - non_constant_identifier_names
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes
    - slash_for_doc_comments
    - type_init_formals
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_new
    - unnecessary_overrides
    - unnecessary_this
    - use_rethrow_when_possible

analyzer:
  errors:
    # Flutter 3.50 deprecates material.dart in favor of the new material_ui
    # package. Keep the established import while this package supports older
    # Flutter SDKs where material_ui is unavailable.
    deprecated_member_use: ignore
  exclude:
    - examples/**
    - build/**
    - linux/**
