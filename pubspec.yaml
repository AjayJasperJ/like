name: like
description: "LIKE - A high-performance, offline-first Flutter networking package built with Dio and Hive."
version: 2.2.5
repository: https://github.com/AjayJasperJ/like

topics:
  - http
  - offline-first
  - cache
  - networking
  - dio


environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.10.0
  hive: ^2.2.3
  hive_flutter: ">=1.1.0 <2.0.0"
  connectivity_plus: ^7.2.0
  toastification: ^3.2.0
  universal_io: ^2.3.1
  crypto: ^3.0.7
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  collection: ^1.19.1
  uuid: ^4.5.3
  synchronized: ^3.4.1
  http_parser: ^4.1.2
  flutter_cache_manager: ^3.4.1
  cached_network_image: ">=3.4.1 <5.0.0"
  file: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true


