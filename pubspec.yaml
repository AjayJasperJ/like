name: like
description: "LIKE - A high-performance Network Package Build with Dio & Hive! 100% data Encrypted & Secure."
version: 2.1.2
repository: https://github.com/AjayJasperJ/like

topics:
  - http
  - offline-first
  - cache
  - networking
  - dio


environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ">=5.0.0 <6.0.0"
  hive: ">=2.0.0 <3.0.0"
  hive_flutter: ">=1.1.0 <2.0.0"
  connectivity_plus: ">=6.0.3 <8.0.0"
  toastification: ">=3.0.0 <4.0.0"
  universal_io: ">=2.0.0 <3.0.0"
  crypto: ">=3.0.0 <4.0.0"
  encrypt: ">=5.0.0 <6.0.0"
  path_provider: ">=2.0.0 <3.0.0"
  path: ">=1.8.0 <2.0.0"
  provider: ">=6.0.0 <7.0.0"
  dio_smart_retry: ">=6.0.0 <8.0.0"
  collection: ">=1.15.0 <2.0.0"
  uuid: ">=4.0.0 <5.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"
  synchronized: ">=3.0.0 <4.0.0"
  http_parser: ">=4.0.0 <5.0.0"
  flutter_cache_manager: ">=3.0.0 <4.0.0"
  cached_network_image: ">=3.0.0 <4.0.0"
  file: ">=7.0.0 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true


