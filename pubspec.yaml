name: like
description: "LIKE - A high-performance Network Package Build with Dio & Hive! 100% data Encrypted & Secure."
version: 1.1.2
repository: https://github.com/AjayJasperJ/like

topics:
  - http
  - offline-first
  - cache
  - networking
  - dio


environment:
  sdk: ^3.8.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.1.1
  toastification: ^3.2.0
  universal_io: ^2.2.2
  crypto: ^3.0.7
  encrypt: ^5.0.3
  path_provider: ^2.1.5
  path: ^1.9.1
  provider: ^6.1.5+1
  dio_smart_retry: ^7.0.1
  collection: ^1.19.1
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  workmanager: ^0.9.0+3
  synchronized: ^3.4.0+1
  http_parser: ^4.1.2
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  file: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true


