name: Native platform checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Configure temporary SDK paths
        run: |
          echo "FLUTTER_SDK_DIR=$RUNNER_TEMP/like-native-flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/like-native-pub" >> "$GITHUB_ENV"
      - name: Install temporary Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_SDK_DIR"
          echo "$FLUTTER_SDK_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_SDK_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_SDK_DIR/bin/flutter" --version
      - run: flutter pub get
      - name: Native VM tests
        run: flutter test --concurrency=2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - name: Compile Linux and Android example
        if: runner.os == 'Linux'
        working-directory: example
        run: |
          flutter create --project-name like_example --platforms=linux,android .
          flutter build linux --debug
          flutter build apk --debug
      - name: Compile macOS and iOS simulator example
        if: runner.os == 'macOS'
        working-directory: example
        run: |
          flutter create --project-name like_example --platforms=macos,ios .
          flutter build macos --debug
          flutter build ios --simulator --debug
      - name: Compile Windows example
        if: runner.os == 'Windows'
        working-directory: example
        run: |
          flutter create --project-name like_example --platforms=windows .
          flutter build windows --debug
      - name: Delete temporary SDK and dependencies
        if: always()
        run: rm -rf -- "$FLUTTER_SDK_DIR" "$PUB_CACHE"
