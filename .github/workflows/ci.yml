name: Package checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure temporary SDK paths
        run: |
          echo "FLUTTER_SDK_DIR=$RUNNER_TEMP/like-test-flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/like-test-pub-cache" >> "$GITHUB_ENV"
      - name: Download temporary Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_SDK_DIR"
          echo "$FLUTTER_SDK_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_SDK_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_SDK_DIR/bin/flutter" precache --web
          "$FLUTTER_SDK_DIR/bin/flutter" --version
      - name: Verify generator and release metadata
        run: |
          python3 -m unittest discover -s tool/openapi -p 'test_*.py'
          python3 tool/openapi/generate.py tool/openapi/fixture.json test/generated/fixture_api.dart --check
          python3 tool/check_release.py
      - run: flutter pub get
      - name: Check changed Dart formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse HEAD^)
          else
            git fetch --depth=1 origin "$BASE_SHA"
          fi
          git diff --name-only -z --diff-filter=ACM "$BASE_SHA" HEAD -- '*.dart' | xargs -0 -r dart format
          git diff -- '*.dart'
      - run: flutter test --coverage
      - name: Browser tests in headless Chrome
        run: |
          python3 tool/browser_test_server.py &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ok >/dev/null; then break; fi
            sleep 1
          done
          flutter test --platform chrome test/portable test/core test/models test/widgets/like_builder_test.dart test/widgets/like_when_test.dart test/widgets/like_sliver_builder_test.dart test/extensions_test.dart test/pagination_test.dart
      - name: Install test server dependencies
        working-directory: server
        run: dart pub get
      - name: Test API server
        working-directory: server
        run: dart test
      - name: Test state management integrations
        working-directory: example
        run: flutter test --coverage --coverage-path=../coverage/example.lcov.info
      - run: flutter analyze
      - name: Build web example
        working-directory: example
        run: |
          flutter pub get
          flutter build web
      - name: Require committed Dart formatting
        run: git diff --exit-code -- '*.dart'
      - name: Validate package contents
        run: |
          # Flutter setup migrates these files on the runner only.
          git restore -- analysis_options.yaml example/analysis_options.yaml
          flutter pub publish --dry-run
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 1
          if-no-files-found: ignore
      # No SDK/dependency cache is uploaded. On cancellation/timeout the hosted
      # runner is also discarded; cleanup is best effort if the job is killed.
      - name: Delete temporary SDK and dependencies
        if: always()
        run: |
          rm -rf -- "$FLUTTER_SDK_DIR" "$PUB_CACHE"
