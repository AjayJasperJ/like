name: Minimum Flutter compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimum-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install documented minimum SDK temporarily
        run: |
          echo "FLUTTER_SDK_DIR=$RUNNER_TEMP/minimum-flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/minimum-pub" >> "$GITHUB_ENV"
          git clone --depth 1 --branch 3.32.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/minimum-flutter"
          echo "$RUNNER_TEMP/minimum-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/minimum-flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/minimum-flutter/bin/flutter" --version
      - run: flutter pub get
      - run: flutter test --concurrency=2
      - name: Resolve and test state-management example
        working-directory: example
        run: |
          flutter pub get
          flutter test
      - run: flutter analyze
      - name: Clean temporary SDK
        if: always()
        run: rm -rf -- "$FLUTTER_SDK_DIR" "$PUB_CACHE"
