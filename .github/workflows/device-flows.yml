name: Device flow tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-flows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Temporary Flutter SDK
        run: |
          echo "FLUTTER_SDK_DIR=$RUNNER_TEMP/device-flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/device-pub" >> "$GITHUB_ENV"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/device-flutter"
          echo "$RUNNER_TEMP/device-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/device-flutter/bin/flutter" config --no-analytics
      - name: Allow hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Complete flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/test_device_apps.sh emulator-5554 android
      - name: Upload native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/device-diagnostics/
          retention-days: 1
          if-no-files-found: ignore
      - name: Remove temporary SDK and dependencies
        if: always()
        run: rm -rf -- "$FLUTTER_SDK_DIR" "$PUB_CACHE"
  ios:
    name: iOS ${{ matrix.flow.state }} ${{ matrix.flow.test }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flow:
          - {state: provider, test: flow_test}
          - {state: riverpod, test: flow_test}
          - {state: bloc, test: flow_test}
          - {state: provider, test: live_api_test}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Temporary Flutter SDK
        run: |
          echo "FLUTTER_SDK_DIR=$RUNNER_TEMP/device-flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/device-pub" >> "$GITHUB_ENV"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/device-flutter"
          echo "$RUNNER_TEMP/device-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/device-flutter/bin/flutter" config --no-analytics
      - name: Select Xcode 26 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Complete flows on iOS simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcrun simctl boot "$device_id" || true
          open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          bash tool/test_device_apps.sh "$device_id" ios "${{ matrix.flow.state }}" "${{ matrix.flow.test }}"
      - name: Upload native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-diagnostics-${{ runner.os }}-${{ matrix.flow.state }}-${{ matrix.flow.test }}
          path: ${{ runner.temp }}/device-diagnostics/
          retention-days: 1
          if-no-files-found: ignore
      - name: Remove temporary SDK and dependencies
        if: always()
        run: rm -rf -- "$FLUTTER_SDK_DIR" "$PUB_CACHE"
