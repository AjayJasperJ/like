name: Documentation site
on:
  pull_request:
    paths:
      - 'site/**'
      - 'documents/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'documents/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    outputs:
      pages_artifact: ${{ steps.pages-name.outputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation renderer
        run: python -m pip install -r site/requirements.txt
      - name: Verify content, routes, links and agent exports
        run: python -m unittest discover -s site -p 'test_*.py'
      - name: Check JavaScript syntax
        run: node --check site/assets/app.js
      - name: Build GitHub Pages artifact
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
        run: python site/build.py
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/docs-browser" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/docs-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke checks
        env:
          DOCS_PLAYWRIGHT: ${{ runner.temp }}/docs-browser/node_modules/playwright
          DOCS_SCREENSHOTS: ${{ runner.temp }}/docs-screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/docs-preview/like"
          cp -R site/_build/. "$RUNNER_TEMP/docs-preview/like/"
          python -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/docs-preview" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/like/ > /dev/null; then break; fi
            sleep 1
          done
          node site/test_ui.cjs
      - name: Upload browser review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: like-docs-screenshots
          path: ${{ runner.temp }}/docs-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload reviewable static site
        uses: actions/upload-artifact@v7
        with:
          name: like-documentation-site
          path: site/_build
          include-hidden-files: true
          retention-days: 7
      - name: Name this build artifact
        id: pages-name
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.pages-name.outputs.name }}
          path: site/_build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
