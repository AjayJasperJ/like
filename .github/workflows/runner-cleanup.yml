name: Cancel obsolete automatic runs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/runner-cleanup.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel stale automatic tests and superseded documentation runs
        uses: actions/github-script@v8
        with:
          script: |
            const active = new Set(['queued', 'in_progress', 'pending', 'waiting', 'requested']);
            const heavy = new Set(['ci.yml', 'minimum-sdk.yml', 'native-checks.yml', 'device-flows.yml', 'shop-apps.yml']);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...context.repo, per_page: 100});
            const latestDocs = runs.filter(run => run.path.endsWith('/documentation.yml') && run.head_branch === 'main').sort((a, b) => b.id - a.id)[0];
            const targets = [];
            let cancelled = 0;
            for (const run of runs) {
              if (run.id === context.runId || !active.has(run.status)) continue;
              const file = run.path.split('/').pop();
              const automatic = run.event === 'pull_request' || (run.event === 'push' && run.head_branch === 'main');
              const obsoleteHeavy = heavy.has(file) && automatic;
              const obsoleteDocs = file === 'documentation.yml' && automatic && run.id !== latestDocs?.id;
              if (!obsoleteHeavy && !obsoleteDocs) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                cancelled++;
                targets.push(run.id);
                core.info(`Cancellation requested: ${run.id} ${run.name} (${run.head_branch})`);
              } catch (error) {
                if (error.status === 409 || error.status === 422) core.info(`Run ${run.id} already finishing: ${error.status}`);
                else throw error;
              }
            }
            if (targets.length) await new Promise(resolve => setTimeout(resolve, 15000));
            for (const id of targets) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: id});
              if (!active.has(run.status)) continue;
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {...context.repo, run_id: id});
                core.info(`Forced cancellation of unresponsive obsolete run: ${id}`);
              } catch (error) {
                if (error.status === 409 || error.status === 422) core.info(`Run ${id} already finishing: ${error.status}`);
                else throw error;
              }
            }
            await core.summary.addHeading('Runner cleanup').addRaw(`Requested cancellation of ${cancelled} obsolete automatic runs. Latest main documentation, explicit release tags and manual runs were preserved.`).write();
