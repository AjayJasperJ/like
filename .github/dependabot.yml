version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /example
      - /server
      - /examples/shop_shared
      - /examples/provider_app
      - /examples/riverpod_app
      - /examples/bloc_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-dart:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
